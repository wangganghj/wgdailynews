services:
  news:
    image: ${NEWS_IMAGE:-ghcr.io/wangganghj/wgdailynews:latest}
    build: .
    container_name: daily-news
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TIMEZONE: ${TIMEZONE:-America/Vancouver}
      UPDATE_HOUR: ${UPDATE_HOUR:-8}
      UPDATE_MINUTE: ${UPDATE_MINUTE:-0}
      DATABASE_PATH: /data/news.db
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-google}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - news-data:/data

volumes:
  news-data:
